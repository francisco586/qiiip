<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LUSSO — Póster editable</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Quicksand:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ====== AJUSTES RÁPIDOS: cambia colores y fuentes aquí ====== */
  :root {
    --color-texto: #ffffff;
    --color-marca: #11131f;
    --color-dorado: #c79a3b;
    --fuente-titulo: 'Playfair Display', Georgia, serif;   /* MAGICAL */
    --fuente-subtitulo: 'Quicksand', sans-serif;            /* Minimal, Modern */
    --fuente-base: 'Poppins', Arial, sans-serif;
  }

  body { margin: 0; background: #2a2a2e; display: flex; justify-content: center; }
  .lienzo {
    position: relative; width: 1200px; height: 1500px; flex: none;
    background: url('fondo-limpio.jpg') 0 0 / 1200px 1500px no-repeat;
    font-family: var(--fuente-base); color: var(--color-texto);
    transform-origin: top center;
  }
  .lienzo * { position: absolute; margin: 0; outline: none; }
  [contenteditable]:hover { box-shadow: 0 0 0 1px rgba(255,255,255,.5); cursor: text; }

  #logo            { left: 0; right: 0; top: 22px; text-align: center; }
  #logo .marca     { position: static; font-size: 58px; font-weight: 600; letter-spacing: 4px;
                     color: var(--color-marca); }
  #logo .marca b   { color: var(--color-dorado); font-weight: 600; }
  #logo .sub       { position: static; display: block; font-size: 25px; font-weight: 500;
                     letter-spacing: 6px; color: var(--color-marca); }

  #tagline   { left: 0; right: 0; top: 200px; text-align: center; font-size: 13.5px;
               letter-spacing: .4px; }
  #subtitulo { left: 0; right: 0; top: 240px; text-align: center; font-size: 92px;
               font-weight: 700; font-family: var(--fuente-subtitulo); line-height: 1.0; }
  #titulo    { left: 0; right: 0; top: 330px; text-align: center; font-size: 238px;
               font-family: var(--fuente-titulo); line-height: 0.78; opacity: .97;
               transform: scaleX(.8); }
  #planta-delante  { left: 340px; top: 415px; width: 205px; pointer-events: none; }
  #lampara-delante { left: 700px; top: 440px; width: 225px; pointer-events: none; }

  .pie       { font-size: 26px; font-weight: 500; line-height: 1.45; }
  #direccion { left: 98px;  top: 1390px; }
  #telefonos { left: 988px; top: 1392px; letter-spacing: 1px; font-size: 25px; }
  #pin       { left: 33px;  top: 1390px; width: 48px; }
  #whatsapp  { left: 895px; top: 1397px; width: 66px; }
</style>
</head>
<body>
<div class="lienzo">

  <div id="logo">
    <span class="marca" contenteditable>▲ LUSS<b>Ⓞ</b></span>
    <span class="sub" contenteditable>CUSTOMIZED SOFA</span>
  </div>

  <p id="tagline" contenteditable>We are happy to create an atmosphere that keeps your family comfortable and warm in a neat and minimalist home.</p>

  <p id="subtitulo" contenteditable>Minimal, Modern</p>

  <p id="titulo" contenteditable>MAGICAL</p>

  <img id="planta-delante" src="recorte-planta.png" alt="">
  <img id="lampara-delante" src="recorte-lampara.png" alt="">

  <svg id="pin" viewBox="-26 -28 52 64"><path d="M 0 -26 C 14 -26 24 -16 24 -3 C 24 10 8 24 0 32 C -8 24 -24 10 -24 -3 C -24 -16 -14 -26 0 -26 Z" fill="#e02d2d"/><circle cy="-2" r="9" fill="#fff"/></svg>
  <div id="direccion" class="pie" contenteditable>Kuttapunna Bangalam<br>Nileshwar Kasaragod Kerala</div>

  <svg id="whatsapp" viewBox="-33 -33 66 66"><circle r="33" fill="#27a737"/><path d="M -14 16 L -10 4 C -16 -6 -13 -16 -3 -20 C 8 -24 18 -18 20 -8 C 22 3 14 13 3 14 C -1 14.5 -5 13.5 -8 11.5 Z" fill="#fff"/><path d="M -6 -8 C -7 -3 -3 4 3 6 C 6 7 8 6 9 4 L 6 0 L 3 1 C 0 -1 -1 -3 -1 -5 L 1 -7 L -2 -10 Z" fill="#27a737"/></svg>
  <div id="telefonos" class="pie" contenteditable>755 8000 119<br>8893 119 119</div>

</div>
<script>
  // Escala el lienzo para que quepa en la ventana (solo visual, no afecta la edición)
  const ajustar = () => {
    const s = Math.min(1, (window.innerWidth - 20) / 1200);
    document.querySelector('.lienzo').style.transform = `scale(${s})`;
    document.body.style.height = 1500 * s + 'px';
  };
  window.addEventListener('resize', ajustar); ajustar();
</script>
</body>
</html>
