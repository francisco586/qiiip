<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Studio 5277 · el nuevo showroom de qiiip en Francisco de Ginebra 5277, Vitacura.">
<meta property="og:title" content="Studio 5277 · Edición 01">
<meta property="og:description" content="El nuevo showroom de qiiip en Vitacura.">
<meta property="og:image" content="https://francisco586.github.io/qiiip/studio5277/pages/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="pages/favicon.png">
<title>Studio 5277 · Edición 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark reading room — thin top bar, the magazine centred on the stage, a control strip below, thumbnails in a drawer. */
:root{
  --room:#1B1A19; --room-2:#242220; --line:#3A3734; --ink:#EEEAE4; --mute:#A39D95; --accent:#D08A6E;
  --display:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --ui:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
html,body{margin:0}
body{background:var(--room);color:var(--ink);font-family:var(--ui);margin:0;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:26px;width:auto}
.brand .t{font-family:var(--display);font-size:24px;line-height:1;white-space:nowrap}
.brand .s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tools{display:flex;gap:8px}
button{font:inherit;color:var(--ink);background:var(--room-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:18px;position:relative}
#book{margin:0 auto}
#bookwrap{transition:transform .45s ease}
#book .page{background:transparent;overflow:hidden}
.stf__parent,.stf__block,.stf__wrapper{background:transparent!important}
#book .stf__item img, .page img{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;justify-content:center;padding:0;z-index:5}
.nav.prev{left:4px}.nav.next{right:4px}
footer{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding-block:12px 16px;border-top:1px solid var(--line)}
#range{flex:1;min-width:0;accent-color:var(--accent)}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);white-space:nowrap;min-width:92px;text-align:right}
.drawer{position:fixed;inset:0;background:rgba(15,14,13,.94);z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.drawer h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 4px}
.drawer p{margin:0 0 20px;color:var(--mute);font-size:13px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 14px;max-width:1100px;margin:0 auto}
.thumb{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;border-radius:0;align-items:stretch;color:var(--mute);font-size:12px}
.thumb img{width:100%;aspect-ratio:186/240;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.45);outline:1px solid var(--line)}
.thumb.on img{outline:2px solid var(--accent)}
.thumb span{font-variant-numeric:tabular-nums}
.zoom{position:fixed;inset:0;background:#0E0D0C;z-index:30;overflow:auto;cursor:zoom-out;padding-inline:0}
.zoom .zin{display:flex;gap:0;justify-content:center;min-width:min-content;padding-block:24px}
.zoom img{width:min(1240px,92vw);height:auto;display:block}
.zoom .z2 img{width:min(1240px,46vw)}
.zclose{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:31}
.fallback .page{width:100%;height:100%}
.hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);letter-spacing:.04em;white-space:nowrap}
@media (max-width:640px){
  .brand .s{display:none}
  .tools .lbl{display:none}
  .nav{display:none}
  .count{min-width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">
      <img src="pages/logo_w.png" alt="qiiip">
      <span class="t">Studio 5277</span>
      <span class="s">Edición 01 · Octubre 2026</span>
    </div>
    <div class="tools">
      <button id="bThumbs" type="button" aria-label="Ver todas las páginas"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg><span class="lbl">Páginas</span></button>
      <button id="bZoom" type="button" aria-label="Ampliar"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M7 4.5v5M4.5 7h5"/></svg><span class="lbl">Ampliar</span></button>
      <button id="bFull" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 16 16"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg><span class="lbl">Pantalla completa</span></button>
    </div>
  </header>
  <div class="stage" id="stage">
    <button class="nav prev" id="bPrev" type="button" aria-label="Página anterior"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
    <div id="bookwrap"></div>
    <button class="nav next" id="bNext" type="button" aria-label="Página siguiente"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    <div class="hint" id="hint">Arrastra la esquina o usa las flechas para pasar página</div>
  </div>
  <footer>
    <input id="range" type="range" min="1" max="30" value="1" aria-label="Ir a página">
    <div class="count" id="count">1 / 30</div>
  </footer>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="dhead">
    <div><h2>Studio 5277 · Edición 01</h2><p>30 páginas. Toca una para abrirla.</p></div>
    <button id="bClose" type="button">Cerrar</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="zoom" id="zoom" hidden><button class="zclose" id="bZclose" type="button">Cerrar</button><div class="zin" id="zin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  var N=30, pages=[], i;
  for(i=1;i<=N;i++) pages.push('pages/pg'+(i<10?'0':'')+i+'.jpg');
  var wrap=document.getElementById('bookwrap'), book=null, range=document.getElementById('range'), count=document.getElementById('count');
  var stage=document.getElementById('stage');
  var flip=null, cur=0, fallback=false, PW=0, PORT=false;
  function center(idx){ var tx=0; if(flip && !fallback && !PORT){ if(idx===0) tx=-PW/2; else if(idx===N-1) tx=PW/2; } wrap.style.transform='translateX('+tx+'px)'; }

  function size(){
    var r=stage.getBoundingClientRect();
    var h=Math.max(240, r.height-36), w=Math.max(200, r.width-120);
    var portrait = window.innerWidth<720;
    var pw = Math.min(h*0.775, portrait ? (r.width-8) : w/2);
    return {w:Math.floor(pw), h:Math.floor(pw/0.775), portrait:portrait};
  }
  function label(idx){
    if(!flip || fallback) return (idx+1)+' / '+N;
    var o=flip.getOrientation ? flip.getOrientation() : 'landscape';
    if(o==='portrait'||idx===0||idx===N-1) return (idx+1)+' / '+N;
    var a = idx%2===1 ? idx : idx-1;
    return (a+1)+'–'+(a+2)+' / '+N;
  }
  function update(idx){ cur=idx; range.value=idx+1; count.textContent=label(idx); center(idx);
    var t=document.querySelectorAll('.thumb'); t.forEach(function(b,j){b.classList.toggle('on',j===idx)}); }

  function build(){
    var s=size();
    wrap.innerHTML=''; book=document.createElement('div'); book.id='book'; wrap.appendChild(book);
    var bw=(s.portrait? s.w : s.w*2); wrap.style.width=bw+'px'; wrap.style.height=s.h+'px'; book.style.width=bw+'px'; book.style.height=s.h+'px';
    if(window.St && St.PageFlip){
      try{
        book.innerHTML=pages.map(function(src,k){return '<div class="page"'+((k===0||k===N-1)?' data-density="hard"':'')+'><img src="'+src+'" alt="Página '+(k+1)+'" draggable="false"></div>'}).join('');
        flip=new St.PageFlip(book,{width:s.w,height:s.h,size:'fixed',showCover:true,usePortrait:s.portrait,maxShadowOpacity:0.45,mobileScrollSupport:false,flippingTime:850,drawShadow:true});
        flip.loadFromHTML(book.querySelectorAll('.page'));
        PW=s.w; PORT=s.portrait;
        flip.on('flip',function(e){update(e.data)});
        flip.on('changeOrientation',function(){update(flip.getCurrentPageIndex())});
        update(0); return;
      }catch(err){ flip=null; }
    }
    fallback=true; book.classList.add('fallback'); book.innerHTML='<div class="page"><img id="fimg" alt="Página"></div>';
    book.style.width=s.w+'px'; show(0);
  }
  function show(idx){ idx=Math.max(0,Math.min(N-1,idx)); var im=document.getElementById('fimg'); if(im){im.src=pages[idx]; im.alt='Página '+(idx+1);} update(idx); }
  function go(idx){ idx=Math.max(0,Math.min(N-1,idx)); if(fallback) return show(idx); if(flip) flip.flip(idx); }
  function next(){ if(fallback) return show(cur+1); if(flip) flip.flipNext(); }
  function prev(){ if(fallback) return show(cur-1); if(flip) flip.flipPrev(); }

  document.getElementById('bNext').onclick=next;
  document.getElementById('bPrev').onclick=prev;
  range.addEventListener('change',function(){ if(fallback) show(range.value-1); else if(flip) flip.turnToPage(range.value-1), update(range.value-1); });
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('zoom').hidden||!document.getElementById('drawer').hidden){ if(e.key==='Escape'){closeAll()} return; }
    if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault()}
  });

  // thumbnails
  var grid=document.getElementById('grid'), drawer=document.getElementById('drawer');
  for(i=0;i<N;i++){ (function(j){
    var b=document.createElement('button'); b.type='button'; b.className='thumb';
    b.innerHTML='<img loading="lazy" src="pages/t'+(j<9?'0':'')+(j+1)+'.jpg" alt="Página '+(j+1)+'"><span>'+(j===0?'Portada':j===N-1?'Contraportada':'Página '+(j+1))+'</span>';
    b.onclick=function(){ drawer.hidden=true; if(fallback) show(j); else if(flip){ flip.turnToPage(j); update(j);} };
    grid.appendChild(b); })(i); }
  document.getElementById('bThumbs').onclick=function(){ drawer.hidden=false; };
  document.getElementById('bClose').onclick=function(){ drawer.hidden=true; };

  // zoom
  var zoom=document.getElementById('zoom'), zin=document.getElementById('zin');
  document.getElementById('bZoom').onclick=function(){
    var idx=cur, list=[idx];
    var portrait = !flip || fallback || (flip.getOrientation && flip.getOrientation()==='portrait');
    if(!portrait && idx>0 && idx<N-1){ var a= idx%2===1? idx: idx-1; list=[a,a+1]; }
    zin.className='zin'+(list.length>1?' z2':'');
    zin.innerHTML=list.map(function(k){return '<img src="'+pages[k]+'" alt="Página '+(k+1)+'">'}).join('');
    zoom.hidden=false; zoom.scrollTop=0;
  };
  function closeAll(){ zoom.hidden=true; drawer.hidden=true; }
  zoom.addEventListener('click',function(e){ if(e.target.tagName!=='BUTTON') zoom.hidden=true; });
  document.getElementById('bZclose').onclick=function(){ zoom.hidden=true; };

  // fullscreen
  document.getElementById('bFull').onclick=function(){
    var el=document.documentElement;
    try{ if(!document.fullscreenElement){ var p=el.requestFullscreen&&el.requestFullscreen(); if(p&&p.catch)p.catch(function(){}); } else { document.exitFullscreen(); } }catch(e){}
  };

  // rebuild on resize (debounced)
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){
    var keep=cur; if(flip){ try{flip.destroy()}catch(e){} flip=null; }
    fallback=false; build(); if(keep) setTimeout(function(){ if(fallback) show(keep); else if(flip){ flip.turnToPage(keep); update(keep);} },80);
  },250); });
  setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.hidden=true; },6000);
  build();
})();
</script>

</body>
</html>
